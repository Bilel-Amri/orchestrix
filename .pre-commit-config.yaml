repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: '^(src|tests)/.*\.py$'
      - id: ruff-format
        files: '^(src|tests)/.*\.py$'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
        files: '\.(pem|key)$'

  - repo: local
    hooks:
      - id: pytest-unit
        name: pytest (unit)
        entry: pytest tests/unit -x --no-header
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
